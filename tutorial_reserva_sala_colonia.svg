<svg viewBox="0 0 800 1120" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="800" height="1120" fill="#ffffff"/>

  <!-- Cabecalho -->
  <g transform="translate(40,26) scale(1.8)">
    <path d="M20 2 L36 9 L36 24 C36 36 29 44 20 46 C11 44 4 36 4 24 L4 9 Z" fill="#2f4a63"/>
    <path d="M20 5 L33 10.5 L33 24 C33 34 27 40.5 20 42.5 C13 40.5 7 34 7 24 L7 10.5 Z" fill="none" stroke="#fff" stroke-width="1" opacity="0.85"/>
    <g fill="#fff">
      <path transform="translate(28,24)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(25.66,29.66)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(20,32)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(14.34,29.66)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(12,24)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(14.34,18.34)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(20,16)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(25.66,18.34)" d="M0,-3 L0.71,-0.97 L2.85,-0.93 L1.14,0.37 L1.76,2.43 L0,1.2 L-1.76,2.43 L-1.14,0.37 L-2.85,-0.93 L-0.71,-0.97 Z"/>
      <path transform="translate(20,24)" d="M0,-5 L1.18,-1.62 L4.76,-1.55 L1.90,0.62 L2.94,4.05 L0,2 L-2.94,4.05 L-1.90,0.62 L-4.76,-1.55 L-1.18,-1.62 Z"/>
    </g>
  </g>

  <text x="150" y="55" font-size="25" font-weight="700" fill="#2f4a63">Como reservar a sala de reuniões</text>
  <text x="150" y="85" font-size="25" font-weight="700" fill="#2f4a63">Colônia de Pescadores Z-13</text>
  <text x="150" y="112" font-size="13.5" fill="#777">Passo a passo pelo aplicativo da CEI Ângela Amin — não precisa ter conta nem senha</text>
  <rect x="40" y="132" width="720" height="4" fill="#d13b2e"/>

  <!-- Introducao -->
  <text x="40" y="168" font-size="14.5" fill="#444">A sala de reuniões da Colônia de Pescadores Z-13 pode ser reservada por qualquer pessoa, direto pelo</text>
  <text x="40" y="190" font-size="14.5" fill="#444">celular ou computador, <tspan font-weight="700" fill="#d13b2e">sem precisar criar conta nem senha</tspan> no aplicativo da creche. O pedido só fica</text>
  <text x="40" y="212" font-size="14.5" fill="#444">confirmado depois que alguém da Direção da creche autorizar — por isso é importante enviar o</text>
  <text x="40" y="234" font-size="14.5" fill="#444">pedido com antecedência.</text>

  <!-- Passo 1 -->
  <rect x="85" y="255" width="675" height="72" rx="10" fill="#f8f9fb" stroke="#e2e4e8"/>
  <circle cx="60" cy="291" r="19" fill="#2f4a63"/>
  <text x="60" y="297" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="105" y="278" font-size="16" font-weight="700" fill="#2f4a63">🌐 Abra o aplicativo da creche</text>
  <text x="105" y="300" font-size="13.5" fill="#444">No celular ou computador, abra o link do aplicativo da CEI Ângela Amin. Você vai cair</text>
  <text x="105" y="318" font-size="13.5" fill="#444">direto na tela de login.</text>

  <!-- Passo 2 -->
  <rect x="85" y="342" width="675" height="72" rx="10" fill="#f8f9fb" stroke="#e2e4e8"/>
  <circle cx="60" cy="378" r="19" fill="#2f4a63"/>
  <text x="60" y="384" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="105" y="365" font-size="16" font-weight="700" fill="#2f4a63">🛡️ Clique em "Colônia de Pescadores Z-13"</text>
  <text x="105" y="387" font-size="13.5" fill="#444">Bem embaixo do botão vermelho "Entrar" tem um botão com o brasão da Colônia.</text>
  <text x="105" y="405" font-size="13.5" fill="#444">Clique nele para abrir a tela de reserva da sala.</text>

  <!-- Passo 3 -->
  <rect x="85" y="429" width="675" height="72" rx="10" fill="#f8f9fb" stroke="#e2e4e8"/>
  <circle cx="60" cy="465" r="19" fill="#2f4a63"/>
  <text x="60" y="471" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="105" y="452" font-size="16" font-weight="700" fill="#2f4a63">📅 Confira as datas já reservadas</text>
  <text x="105" y="474" font-size="13.5" fill="#444">Veja a lista "Datas já reservadas" (separada por mês) antes de pedir, para não</text>
  <text x="105" y="492" font-size="13.5" fill="#444">escolher um dia/horário que já está ocupado.</text>

  <!-- Passo 4 -->
  <rect x="85" y="516" width="675" height="90" rx="10" fill="#f8f9fb" stroke="#e2e4e8"/>
  <circle cx="60" cy="561" r="19" fill="#2f4a63"/>
  <text x="60" y="567" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="105" y="539" font-size="16" font-weight="700" fill="#2f4a63">📝 Clique em "+ Solicitar reserva da sala"</text>
  <text x="105" y="561" font-size="13.5" fill="#444">Preencha: seu nome, telefone para contato (opcional), para qual entidade é a reserva,</text>
  <text x="105" y="579" font-size="13.5" fill="#444">e se é <tspan font-weight="700" fill="#3fa845">Empréstimo</tspan> (sem custo) ou <tspan font-weight="700" fill="#2f6fed">Aluguel</tspan>. Depois, a data e o horário de início e fim.</text>

  <!-- Passo 5 -->
  <rect x="85" y="620" width="675" height="72" rx="10" fill="#f8f9fb" stroke="#e2e4e8"/>
  <circle cx="60" cy="656" r="19" fill="#2f4a63"/>
  <text x="60" y="662" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="105" y="643" font-size="16" font-weight="700" fill="#2f4a63">🔁 Vai repetir? Marque "Repetir semanalmente"</text>
  <text x="105" y="665" font-size="13.5" fill="#444">Se for usar a sala todo sábado (ou outro dia fixo), marque essa opção e escolha até</text>
  <text x="105" y="683" font-size="13.5" fill="#444">quando repetir — o pedido é enviado para todas as datas de uma vez.</text>

  <!-- Passo 6 -->
  <rect x="85" y="707" width="675" height="72" rx="10" fill="#f8f9fb" stroke="#e2e4e8"/>
  <circle cx="60" cy="743" r="19" fill="#2f4a63"/>
  <text x="60" y="749" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="105" y="730" font-size="16" font-weight="700" fill="#2f4a63">✅ Envie e aguarde a confirmação</text>
  <text x="105" y="752" font-size="13.5" fill="#444">Clique em "Enviar solicitação". O pedido fica pendente até a Direção confirmar. Volte</text>
  <text x="105" y="770" font-size="13.5" fill="#444">nessa mesma tela mais tarde para ver se já foi confirmado.</text>

  <!-- Aviso -->
  <rect x="40" y="805" width="720" height="80" rx="10" fill="#fff4f2" stroke="#f1c3bd"/>
  <text x="60" y="832" font-size="13.5" fill="#7a2e24"><tspan font-weight="700" fill="#d13b2e">Atenção:</tspan> o pedido só garante a sala depois de <tspan font-weight="700">confirmado</tspan> pela Direção</text>
  <text x="60" y="855" font-size="13.5" fill="#7a2e24">da creche. Se a data/horário escolhido já tiver uma reserva confirmada, o aplicativo</text>
  <text x="60" y="875" font-size="13.5" fill="#7a2e24">avisa na hora e pede para escolher outra data ou horário.</text>

  <!-- Rodape -->
  <line x1="40" y1="920" x2="760" y2="920" stroke="#e2e4e8"/>
  <text x="400" y="945" font-size="12.5" fill="#888" text-anchor="middle">CEI Ângela Amin · Colônia de Pescadores Z-13 · Imbituba - SC</text>
</svg>
